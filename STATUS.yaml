description: "On-demand YouTube-to-karaoke system with AI stem separation, LRC-driven lyric alignment, EBU R128 loudness normalization, real-time pitch scoring with per-section breakdown, confidence-driven guide-vocal auto-ducking, feed-forward microphone auto gain control, an auto-classified browsable song library and off-peak batch pre-processing that yields the machine the moment someone sings, key-aware two-part auto harmony that follows the melody diatonically, and a two-microphone duet mode whose per-frame crosstalk arbitration (level dominance with Schmitt hysteresis plus a pitch-divergence exception) keeps each singer's score honest and whose per-section duel names each singer's home-turf section while refusing to score division-of-labour passages as a contest, and a music-reactive ambient stage background that takes over whenever a song has no usable music video — including the common case of a 'video' that is really one still image, caught by periodically sampling decoded frames — under a hard luminance slew limit so the background never flashes, and cross-session per-section trends that answer which passage a given singer is reliably strong or weak on by comparing each performance against its own mean (so an off-voice night shifts every section together instead of flagging them all as weaknesses) and refusing to speak until three same-layout performances agree on a direction, and per-take performance recordings captured at a dedicated mix bus ahead of the master volume (so turning the speakers down never shrinks the recording) that are kept only when someone actually sang for long enough — measured in milliseconds of detected voicing rather than frame counts, which differ fourfold between a 30fps and a 120fps stage — and evicted oldest-first under a disk-fuse quota that never touches takes the room pinned, refusing a new take outright when every older one is pinned rather than saving it and immediately deleting it as its own eviction victim, and time-limited share links that let a singer carry their own take away by QR - deliberately not burn-on-first-open one-time links, since playing audio is not one request (range seeks, Safari's second fetch) and burning the token would break the visitor's own playback mid-song, so the link expires (24h by default, 30 days maximum, with no never-expires option for a recording of a whole room), can be revoked at any moment, and counts only explicit downloads against an optional cap, dying together with its recording and saying 'that take is gone' rather than 'link not found' - which would read as a mistyped address and send the holder back to rescan the same QR forever, and on-demand MP3 transcoding so a take also opens where it is taken - car USB decks, older phones, a chat app that will not play webm - transcoded only when someone asks (thirty takes a night, three get taken home) and kept as a discardable cache with its own budget that evicts least-recently-used and never evicts a performance, since a take deleted is gone while an MP3 deleted is one re-encode away, ordered by a monotonic sequence rather than a timestamp so a same-second double-click and an NTP step backwards cannot make the just-used copy look like the stalest one, serialized one transcode at a time because singing outranks converting, written to a .part file and atomically renamed with the output format stated explicitly - ffmpeg picks its muxer from the file extension, which a fake ffmpeg in a unit test will never reveal - and hidden outright, with the reason named, when the machine has no ffmpeg or an ffmpeg built without libmp3lame, and a whole-night ZIP export that answers the other thing people ask at closing time - not 'send me mine' but 'give us everything from tonight' - where a night is cut by silence rather than by calendar date, since a room sings from nine to half past two and a date cut would split that in half and label the better half tomorrow (and, in the other direction, would merge an afternoon party and an evening one into a single session), streamed as it is packed rather than staged on disk - a 200 MB night would otherwise cost another 200 MB on the very disk whose exhaustion the recording quota exists to prevent - and therefore deliberately without a Content-Length, because a length computed up front stops being true the moment the quota evicts a take mid-stream and a browser treats a byte-count mismatch as a failed download, with audio stored rather than deflated (Opus re-compresses to within a percent, and that CPU is running the stage), member names carrying an ordinal and a timestamp so the order of the night survives on a car USB deck that sorts by filename, truncated by UTF-8 bytes rather than characters and de-duplicated case-insensitively, and a track listing written last - so it can name the takes that were evicted while the archive was being built instead of listing a file that is not there - all under a single-slot lease that expires, since a viewer who cancels before the first byte leaves a generator that never runs its finally"
description_zh: "把任意 YouTube 歌曲全自動轉成 KTV 伴唱畫面：AI 人聲伴奏分離、LRC 主導的歌詞時間軸對齊、EBU R128 自動音量平衡、即時音準導唱與評分（含唱畢段落評分），導唱人聲隨演唱穩定度自動淡出，麥克風自動增益讓換人唱不必重調音量，曲庫自動依語言別與歌手分類瀏覽，整張播放清單可排程在半夜先跑好（有人唱歌立刻讓開），和聲依歌曲調性照音階疊出第二聲部（三度／五度／低八度，判不出調性就退成八度），對唱模式兩支麥克風分別評分並在每一幀判定「這一幀該算誰的」（電平主導＋遲滯＋音高分歧例外），唱完並排比出勝負，再往下把同一段落兩位的命中率往中間對拉點出各自的主場段落（分段接唱的段落標成主唱、不算勝負），沒抓到 MV（或抓到的其實是一張靜態圖，靠定期取樣影格認出來）的歌改放跟著音樂動的情境背景，亮度走限速器所以永遠不會閃，同一首歌唱滿三次後算得出跨場次的段落趨勢（每一場先減掉那一場自己的平均再累積，所以感冒那天整體下移不會把每一段都算成弱點；要幅度夠大又方向一致才敢說「一向」），每一次演唱都可以錄下來回放（預設關閉：錄到的是包廂裡所有人的聲音；錄音接在喇叭音量之前的 mixBus，把喇叭轉小不會讓錄音跟著變小；留不留看「有人在唱」的累計毫秒數而不是幀數，配額滿了從最舊、沒有標記保留的那一筆開始刪，舊的全被保留時當場拒絕而不是存進去再拿它自己當清理對象），錄好的那一次可以產生有時效的連結與 QR 讓當事人自己掃走（刻意不是「開啟一次就作廢」——播一個音檔不是一次請求，拖進度條的 Range 與 Safari 的第二次請求會把連結燒掉，壞的是當事人自己的播放；所以改成預設 24 小時、最長 30 天、沒有永不過期、隨時可撤銷，「下載幾次就失效」只算真的按下載），錄音被刪或被配額擠掉時連結跟著死，而且講的是「這一次的錄音已經不在了」而不是「連結不存在」——後者會被讀成網址打錯，於是拿到 QR 的人會一直重掃），帶走的那一次還要在帶去的地方打得開 ——車機的 USB、長輩的舊手機、傳過去直接點開的那些地方只認 MP3，所以可以按下去才轉一份（錄完就全部轉是拿正在放歌的 CPU 去換沒人要的檔案），轉出來的是可丟的快取、有自己的上限、滿了從最久沒用到的那一份開始刪而且永遠不擠掉任何一次演唱（演唱刪掉就沒有，MP3 再轉一次就有），LRU 用遞增序號而不是時間戳（同一秒連按兩次分不出先後，NTP 校時會讓剛用過的那一份變成最久沒碰的），同一筆只轉一次、整台機器同時只轉一個（唱歌永遠比轉檔重要），先寫 .part 再原子換檔並明講 -f mp3（ffmpeg 是看副檔名決定格式的，假的 ffmpeg 永遠測不到這一條），機器上沒有 ffmpeg 或那個 ffmpeg 沒有 libmp3lame 時整顆按鈕收起來並說出是哪一種），散場時的另一句話「今天晚上的通通給我一份」則是整晚打包：一整場包成一個 zip（也可以只要某一位唱的），一場照空檔切而不是照日曆日期切（包廂的一場是九點唱到凌晨兩點半，照日期切會剖成兩半而且把唱最嗨的後半標成隔天；反過來同一天下午一輪晚上一輪是兩桌客人，日期法分不出來），畫面上跨午夜寫成「今晚 21:05 – 隔天 02:30」，打包是邊包邊送而不是先在磁碟上生一份（一場 200 MB 就要另外佔 200 MB，而錄音配額存在的理由正是這顆磁碟會被塞爆），因此刻意沒有 Content-Length（先算好的長度只要中途有一筆被配額擠掉就對不上，瀏覽器會把整包判定為下載失敗；沒有百分比只是不方便，下載到 99% 被判失敗會讓人重按三次），音檔一律 stored 不壓縮（Opus 再壓省不到 1%，那顆 CPU 正在放歌）、只有曲目清單用 deflate，zip 裡的檔名帶序號與時間（車機與檔案總管照檔名排序，沒有序號今晚的順序就沒了）、Windows 非法字元與結尾的點與空白清掉、長度照 UTF-8 位元組裁（中文一字 3 bytes）、同名不分大小寫讓開成 (2)，曲目.txt 放在最後一個項目因為它是打包完才生出來的（所以講得出哪幾首在打包當下被配額擠掉而沒包進來；先寫的話它會列出一首資料夾裡沒有的歌，使用者會以為解壓縮壞了），打包途中開不起來的跳過並記一筆而不是整包放棄，檔案先開起來再讀（開著的 fd 不會因為別人 unlink 就消失），整台機器同時只打一包且名額是有期限的租約（按了下載又立刻關掉分頁時串流可能從來沒被跑過，沒有期限那個位子就永遠空不出來），整包刻意不轉 MP3（三十首轉三十次是拿正在放歌的 CPU 去換檔案）也刻意不掛在分享 token 底下（一個 zip 是整場所有人的聲音，不是掃 QR 的人該拿得到的東西）"
key_metrics: "歌詞對齊：LRC 仿射校正 (scale+offset) + 起唱點吸附，行首落點誤差 < 0.1s；自動音量平衡：自實作 ITU-R BS.1770-4 K 加權與雙重閘門，48kHz 係數與規格書一致到小數第 9 位、-20 dBFS 1kHz 正弦量得 -19.99 LUFS；練唱模式：歌詞重複結構分析自動找副歌（含長度守門與單行鉤子退路）＋ A-B 區段循環與段落跳轉；段落評分：沿用曲式分段與逐幀判定，二分搜尋歸段累計，含「音符不足 0.5 秒不評分」與「全距 < 5 個百分點不點名」兩道守門；曲庫分類：歌名/頻道名/歌詞三來源判語言（假名與諺文看比例、粵台語需 ≥2 種方言用字），結果快取進 metadata 只算一次；導唱自動 ducking：沿用評分心跳的逐幀判定，慢退（1.6s）快回（0.22s）＋ Schmitt 遲滯 0.55/0.35 ＋ 暖機 3 秒 ＋ 深度上限 0.95（永遠留安全網），時間常數式 EMA 使 30fps 與 120fps 行為一致；麥克風自動增益：前饋量測（analyser 在增益節點之前，不做回授免得與房間殘響耦合成呼吸迴路），噪音閘門 -45 dBFS 保證安靜時絕不加大，降 0.25s／升 3s 的不對稱曲線，削峰保護以 0.06s 追「輸入＋增益」的推估值且不當成降幅地板，遲滯（1 dB 起動 / 0.15 dB 收手）而非死區以免系統性差一格，加成上限 +9 dB、多人模式收到 +6 dB；ruff lint 與部署檔驗證納入 CI、後端 264 條 + 前端 75 條測試全綠；排程預處理：一次只處理一首（處理完就重新確認現場，讓路上限＝一首歌的時間），時段判斷含跨午夜與全天候，「為什麼還沒開始」常駐畫面，一首失敗不拖垮整批且可只重試失敗項，已完整快取的自動略過（看四個必要檔案而非只看 metadata），任務與「立即開始」意圖都持久化、重開機續跑；v1.0.0 可發布：Docker 一鍵部署（非 root、健康檢查、GPU 換底層映像）＋ 標籤觸發的 release 打包，版本號在 version.py / CHANGELOG / git 標籤三處交叉檢查；和聲：Krumhansl-Kessler 輪廓相關法估調性（權重看時間長度、單一長音上限 2 秒、有效音符 < 8 秒或相關 < 0.45 就拒絕作答並退成低八度），移調量照音階度數算（C 大調的 Do 上三度 +4、Re 上三度 +3），移調 DSP 自寫可變延遲移調（視窗 45ms、兩條讀取頭、交叉淡接只佔一輪 30% 把梳型抵消從 27% 壓到 8% 以內），沒人唱與無導唱音符時不出聲、同一音符不重算、換音符隔 80ms 防抖，音量上限 0.85 永不蓋過主唱；後端 268 條 + 前端 114 條測試全綠；對唱模式：串音判定不是把兩支麥克風混起來打一個分數，而是每一幀回答「這一幀算誰的」（電平差 ≥ 9 dB 只算大聲的那一位、Schmitt 遲滯 9/4.5 dB 免得門檻附近每幀換人、音高差 ≥ 1.5 半音就認定真的有兩個人在唱並照樣給分、但只在被壓的那一邊高於底噪 12 dB 時才敢用），判定一律在計分之前（先量兩支電平 → 判定 → tick(credit, reuseRms) 各自計分，不能先加分再回捲 Combo 與段落統計），比的是增益之前的原始電平（兩支各自的自動增益會抹平音量差），立體聲介面只給單聲道時明確拒絕而不悄悄退回（否則 B 麥拿到的是 A 的複製品、兩人分數一模一樣），各自被算到不足 10 秒就不比勝負、分數差 3% 以內算平手且前後端共用同一個門檻；段落對決：三道守門決定哪些段落可以比（兩邊各自被算到的導唱音符 ≥ 30 幀、少的一邊 ≥ 多的一邊的一半、命中率差 ≥ 5 個百分點才點主場），門檻沿用單人段落評分的同一組值並用測試釘在一起，分段接唱的段落標成「由 X 主唱」且沒唱的那一邊顯示「—」而非 0%，畫法是往中間對拉（兩張獨立長條圖要眼睛自己配對）、最多六段、主場段落入庫為 duel_section；後端 289 條 + 前端 149 條測試全綠；情境背景：靜態圖 MV 偵測每 1.2 秒把畫面縮成 32x18 取樣、平均亮度差門檻 2.0（實測會動的 MV 一筆取樣就得到 10.2、整首同一張圖六筆全是 0，兩邊都有五倍以上餘裕），判定需 4 筆取樣且橫跨 5 秒（觀察窗用牆上時鐘算，短片 loop 繞回 0 不會把它算成負的），暫停中不取樣（差值恆為 0 會誤判成靜止圖），兩個方向都閂鎖不再改判；亮度每秒最多變 0.45（等效閃爍遠低於光敏性癲癇的 3 Hz 安全線），鼓點只推粒子與波形不碰亮度；亮度被主題錨點、設定頁上限、字幕區 vignette 壓三道，情境背景出場時 vignette 自動放輕（三道各壓一點疊起來是全黑，是 render 出來才看到的）；背景為最低優先：30fps 上限、半解析度畫布、分頁看不見不畫、每幀成本超過 8ms 自動降級；自動主題以 FNV 雜湊挑，同一首歌永遠同一個背景；後端 293 條 + 前端 176 條測試全綠；跨場次段落趨勢：比的是一場演唱的形狀不是高度（每場先減自己的平均，且不照音符數加權 ——加權會讓最長的副歌主導基準線，等於拿副歌跟自己比），三道門才開口（同一曲式 ≥ 3 場、平均偏差 ≥ 5 個百分點沿用段落評分門檻、方向一致 ≥ 2/3 場次 ——第三道分得出「三次都掉一點」與「兩次正常一次崩掉」，平均值分不出），曲式指紋不同的場次不混算並以最新一場為準（否則重新處理後新資料永遠進不來），每位演唱者分開累積，只看最近 20 場，4 場以上才談進步退步；順手修掉舞台頁面從 v1.4.0 起的重傷 —— mic-agc.js 與 duet-scorer.js 都在最外層宣告 const SILENCE_DB，同一個全域作用域重複宣告讓 duet-scorer.js 解析階段就丟 SyntaxError 整支不執行，player.js 因此整支停在 new DuetScorer() 那一行（node --check 一次只看一支、node --test 給獨立作用域，兩道都測不到，是真的開瀏覽器才發現的），新增 script-scope.test.js 照 HTML 載入清單守全域名稱衝突；錄唱回放：錄音點在 mixBus（全部聲音先匯流再進 masterGain）而不是 masterGain 之後 —— 後者是喇叭音量，轉小或靜音會把那一次演唱錄成小聲或空白；MediaStreamDestination 只建一次重複用（每首歌建一個會在 AudioContext 裡累積永不回收的節點）；「唱了多久」累計的是毫秒（單幀差夾 100ms 防背景分頁）而不是 sangFrames —— 幀數在 30fps 與 120fps 的舞台上同一首歌差四倍；配額（預設 50 首 / 512 MB）從最舊、未標記保留的開始刪，舊的全被保留時當場拒絕並說明 —— 「先存再清」的寫法會拿剛存進來的那一筆當唯一可刪對象（單元測試先抓到）；webm 容器沒有 Duration（串流容器，錄時不知道會多長），清單長度改用錄的時候量好上傳的值，播放時 seek 到不可能的時間點逼瀏覽器算出長度再跳回 0（只做一次、只在要播時做）；上傳走 raw body + query string（不必多裝 python-multipart），讀 body 前先看 Content-Length；錄音 id 由伺服器產生並用嚴格正則檢查，路徑從索引檔名組出來再確認仍在錄音資料夾底下；以 Playwright 在真的瀏覽器裡跑過錄音→上傳→回放全程；後端 357 條 + 前端 213 條測試全綠；錄音分享：連結 token 為 128 bits urlsafe base64 且形狀先過正則（斜線與點進不來），分享頁是靜態檔、資料由頁面自己打 API 拿並一律 textContent 塞入（歌名是 YouTube 抓回來的字串，伺服器端拼進 HTML 等於把別人取的標題當程式碼跑），公開端點只交出這一筆看得到的欄位（song_id、檔案路徑、其他錄音的存在與否都不外流），失效分四種原因回應（not_found 給 404、expired／revoked／exhausted／gone 給 410，前端才分得出「網址打錯」與「時間到了」），錄音被配額無聲擠掉時由清單路徑上的 prune() 對帳標成 gone 並留七天（TOMBSTONE_DAYS）而不是整筆刪掉，索引放 cache/recording_shares.json 而非錄音資料夾（RecordingLibrary 會把不在索引上的檔案當孤兒檔刪掉，放進去會在下次開機時連同所有已發出的連結一起無聲消失）；以 Playwright 在真的瀏覽器裡跑過分享頁、失效畫面與點歌台分享視窗（第一版彈窗寫成 classList.add('active') 但本專案慣例是 open，單元測試與 node --check 全綠、真的按下去才發現什麼都沒發生）；後端 394 條 + 前端 228 條測試全綠；錄音轉 MP3：轉檔用到才做（一個晚上錄三十首、會被帶走的大概三首，錄完就轉等於拿正在放歌的 CPU 去換沒人要的檔案），轉出來的是可丟的快取放在 cache/recordings/mp3/ 並有自己的上限（錄音配額的 1/4、額外佔用、畫面上寫出數字），滿了從最久沒用到的那一份開始刪且永遠不擠掉任何一次演唱（讓 MP3 吃錄音配額的後果是「按一下下載，最舊的那一次演唱就沒了」——演唱刪掉就沒有、MP3 再轉一次就有，可挽回性不對等）；LRU 用單調遞增序號 mp3_seq 而非時間戳（同一秒內連按兩次分不出先後，而且 NTP 校時會讓時間倒退、剛用過的那一份突然變成最久沒碰的），序號持久化並在重開機時接在最大值之後；兩道關卡：同一筆同時只轉一次（擋「按了沒反應所以再按一次」，排在後面的 worker 先看有沒有人轉好了）＋整台機器同時只轉一個（一桌人同時掃 QR 下載會把 CPU 從舞台那邊搶走），排不進去回「現在忙」而不是無限等待；轉檔跑在 asyncio.to_thread（直接在 async 端點裡跑 subprocess，那十幾秒整台伺服器的 WebSocket 都會停住，症狀是「有人按了下載、舞台上的歌詞就卡住」）；先寫 .part 再 os.replace 原子換檔（逾時或失敗留下的半個檔案被當成 MP3 送出去，使用者的結論會是「那一次錄音壞了」），並且一定要 -f mp3 明講格式——ffmpeg 是看副檔名決定 muxer 的，寫到 xxx.mp3.part 會直接 Error initializing the muxer（假的 ffmpeg 測不到這一條，是真的跑一次才發現的，現在有測試釘著）；ffmpeg 能力先探測再決定畫面並分得出三種狀況（disabled／not_installed／no_lame——為授權把 lame 拆出去的精簡版是真的存在的），探測成功永久快取、失敗只快取 60 秒，分享頁轉不了就連按鈕都不長出來（拿到連結的人不是管理員）；分享連結的「下載幾次就失效」改成拿到檔案之後才計次（失敗的轉檔燒掉當事人的連結）；ID3 標籤帶歌名與演唱者（車機螢幕顯示的就是這個）、44.1kHz、預設 192 kbps；以真的 ffmpeg 跑完全程並用 ffprobe 驗過（mp3/44100/193kbps/時長吻合/標籤正確），四條並行請求只觸發一次轉檔，Playwright 在真的瀏覽器裡按過點歌台與分享頁兩顆 MP3 鈕；整晚打包：場次照空檔切（預設 6 小時、設定頁可調，門檻用「超過」而非「大於等於」，壞掉的時間戳不製造斷點免得多出一場只有一首的鬼場次），key 用開始時間而非流水號（流水號會因為前面的場次被配額清掉而整批位移，昨天複製的網址今天指到別場），串流打包用只有 write/tell、沒有 seek 的 sink（zipfile 因此改用 data descriptor 把 CRC 與大小寫在資料後面，而不是先留白事後回頭補 —— 已送出的位元組改不了），音檔 ZIP_STORED、曲目清單 ZIP_DEFLATED，檔名 01 21-05 歌名 - 演唱者.webm（序號與時間在前、冒號換成 -、UTF-8 位元組裁切、不分大小寫去重），曲目.txt 最後才寫所以講得出漏了哪幾首，單一名額用有期限的租約（generator 有可能從來沒被執行）；後端 471 條 + 前端 249 條測試全綠"
