<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaraTube - 舞台演唱螢幕 (Stage Screen)</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/karaoke.css">
</head>
<body class="stage-mode">
  <!-- Hidden Audio Players for Web Audio Synced Decoding -->
  <audio id="audioInst" preload="auto" crossorigin="anonymous"></audio>
  <audio id="audioVoc" preload="auto" crossorigin="anonymous"></audio>

  <!-- Autoplay / Click to Start Prompt -->
  <div id="audioPromptOverlay" class="audio-prompt-overlay">
    <div class="audio-prompt-box">
      <div style="font-size: 52px; margin-bottom: 12px;">🎤</div>
      <h2 style="font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px;">點擊螢幕啟用 KTV 伴唱音效與麥克風</h2>
      <p style="font-size: 14px; color: var(--accent-cyan);">點擊後即可解鎖瀏覽器聲音播放與麥克風即時評分！</p>
    </div>
  </div>

  <div class="stage-wrapper">
    <!-- Background Video MV Layer -->
    <video id="videoBg" class="video-background" muted playsinline loop></video>
    <div class="stage-vignette"></div>

    <!-- Top HUD: Song Info & Score -->
    <header class="stage-header">
      <div class="stage-song-info">
        <div id="stageTitle" class="stage-song-title">KaraTube 伴唱系統</div>
        <div id="stageArtist" class="stage-song-artist">請在點歌台搜尋並點播歌曲</div>
      </div>

      <div class="stage-hud">
        <div class="score-card">
          <div class="score-label">KTV SCORE</div>
          <div id="scoreValue" class="score-value">000000</div>
          <div id="comboValue" class="combo-badge"></div>
        </div>
      </div>
    </header>

    <!-- Center Pitch Guide Bar (JOYSOUND / DAM Style Note Visualization) -->
    <div class="pitch-visualizer-container">
      <canvas id="pitchCanvas"></canvas>
    </div>

    <!-- Bottom KTV Subtitles (2-Line Alternating Sweeping Subtitles) -->
    <div id="subtitlesContainer" class="karaoke-subtitles-container">
      <!-- Generated by KaraokeRenderer -->
    </div>

    <!-- Floating Up-Next Notification -->
    <div id="nextSongToast" class="next-song-toast" style="display: none;"></div>

    <!-- 導唱片頭卡：商用 KTV 的「演唱者：XXX」開場卡，前奏時亮 8 秒 -->
    <div id="introCard" class="intro-card">
      <div class="intro-kicker">♪ 接下來演唱</div>
      <div id="introTitle" class="intro-title"></div>
      <div id="introArtist" class="intro-artist"></div>
      <div id="introRequester" class="intro-requester"></div>
    </div>

    <!-- 唱畢總評分結算畫面（點一下直接進下一首） -->
    <div id="settlementOverlay" class="settlement-overlay">
      <div class="settlement-card">
        <div class="settlement-heading">🏁 演唱結束</div>
        <div id="settleSongTitle" class="settlement-song"></div>
        <div class="settlement-main">
          <div class="settlement-score-block">
            <div class="settlement-label">TOTAL SCORE</div>
            <div id="settleScore" class="settlement-score">0</div>
          </div>
          <div id="settleGrade" class="settlement-grade">S</div>
        </div>
        <div class="settlement-stats">
          <div class="settlement-stat">
            <div class="settlement-label">🎯 音準率</div>
            <div id="settleAccuracy" class="settlement-stat-value">0%</div>
          </div>
          <div class="settlement-stat">
            <div class="settlement-label">🔥 最大 COMBO</div>
            <div id="settleCombo" class="settlement-stat-value">0</div>
          </div>
        </div>
        <div id="settleBest" class="settlement-best"></div>
        <div id="settleBeat" class="settlement-beat"></div>
        <div class="settlement-hint">點擊畫面進下一首</div>
      </div>
    </div>

    <!-- 字幕同步微調提示（按 ← → 調整，0 歸零） -->
    <div id="syncToast" class="sync-toast" style="display: none;"></div>

    <!-- 音訊裝置設定（按 S 開啟）。裝置 ID 綁這台機器，只能在舞台端選 -->
    <button id="audioSetupBtn" class="stage-gear" title="音訊裝置設定 (S)">⚙️</button>
    <div id="audioSetupPanel" class="stage-panel" style="display: none;">
      <div class="stage-panel-header">
        <span>🔊 音訊裝置</span>
        <button id="closeAudioSetup" class="stage-panel-close">✕</button>
      </div>

      <div class="stage-panel-row">
        <label>演唱模式</label>
        <div class="mode-switch">
          <button id="modeSoloBtn" class="mode-btn active">🎧 單人</button>
          <button id="modePartyBtn" class="mode-btn">🔊 多人</button>
        </div>
      </div>
      <p id="modeHint" class="stage-panel-hint">
        單人模式：人聲不進喇叭，不可能有回授。評分照常運作。
      </p>

      <div class="stage-panel-row">
        <label>🎙️ 麥克風</label>
        <select id="inputDeviceSelect"></select>
      </div>

      <div class="stage-panel-row">
        <label>🔈 喇叭輸出</label>
        <select id="outputDeviceSelect"></select>
      </div>
      <p id="outputHint" class="stage-panel-hint"></p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/audio-effects.js"></script>
  <script src="/js/karaoke-renderer.js"></script>
  <script src="/js/pitch-engine.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
