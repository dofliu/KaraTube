description: "On-demand YouTube-to-karaoke system with AI stem separation, LRC-driven lyric alignment, EBU R128 loudness normalization, real-time pitch scoring with per-section breakdown, confidence-driven guide-vocal auto-ducking, feed-forward microphone auto gain control, an auto-classified browsable song library and off-peak batch pre-processing that yields the machine the moment someone sings, key-aware two-part auto harmony that follows the melody diatonically, and a two-microphone duet mode whose per-frame crosstalk arbitration (level dominance with Schmitt hysteresis plus a pitch-divergence exception) keeps each singer's score honest and whose per-section duel names each singer's home-turf section while refusing to score division-of-labour passages as a contest, and a music-reactive ambient stage background that takes over whenever a song has no usable music video — including the common case of a 'video' that is really one still image, caught by periodically sampling decoded frames — under a hard luminance slew limit so the background never flashes, and cross-session per-section trends that answer which passage a given singer is reliably strong or weak on by comparing each performance against its own mean (so an off-voice night shifts every section together instead of flagging them all as weaknesses) and refusing to speak until three same-layout performances agree on a direction, and per-take performance recordings captured at a dedicated mix bus ahead of the master volume (so turning the speakers down never shrinks the recording) that are kept only when someone actually sang for long enough — measured in milliseconds of detected voicing rather than frame counts, which differ fourfold between a 30fps and a 120fps stage — and evicted oldest-first under a disk-fuse quota that never touches takes the room pinned, refusing a new take outright when every older one is pinned rather than saving it and immediately deleting it as its own eviction victim"
description_zh: "把任意 YouTube 歌曲全自動轉成 KTV 伴唱畫面：AI 人聲伴奏分離、LRC 主導的歌詞時間軸對齊、EBU R128 自動音量平衡、即時音準導唱與評分（含唱畢段落評分），導唱人聲隨演唱穩定度自動淡出，麥克風自動增益讓換人唱不必重調音量，曲庫自動依語言別與歌手分類瀏覽，整張播放清單可排程在半夜先跑好（有人唱歌立刻讓開），和聲依歌曲調性照音階疊出第二聲部（三度／五度／低八度，判不出調性就退成八度），對唱模式兩支麥克風分別評分並在每一幀判定「這一幀該算誰的」（電平主導＋遲滯＋音高分歧例外），唱完並排比出勝負，再往下把同一段落兩位的命中率往中間對拉點出各自的主場段落（分段接唱的段落標成主唱、不算勝負），沒抓到 MV（或抓到的其實是一張靜態圖，靠定期取樣影格認出來）的歌改放跟著音樂動的情境背景，亮度走限速器所以永遠不會閃，同一首歌唱滿三次後算得出跨場次的段落趨勢（每一場先減掉那一場自己的平均再累積，所以感冒那天整體下移不會把每一段都算成弱點；要幅度夠大又方向一致才敢說「一向」），每一次演唱都可以錄下來回放（預設關閉：錄到的是包廂裡所有人的聲音；錄音接在喇叭音量之前的 mixBus，把喇叭轉小不會讓錄音跟著變小；留不留看「有人在唱」的累計毫秒數而不是幀數，配額滿了從最舊、沒有標記保留的那一筆開始刪，舊的全被保留時當場拒絕而不是存進去再拿它自己當清理對象）"
key_metrics: "歌詞對齊：LRC 仿射校正 (scale+offset) + 起唱點吸附，行首落點誤差 < 0.1s；自動音量平衡：自實作 ITU-R BS.1770-4 K 加權與雙重閘門，48kHz 係數與規格書一致到小數第 9 位、-20 dBFS 1kHz 正弦量得 -19.99 LUFS；練唱模式：歌詞重複結構分析自動找副歌（含長度守門與單行鉤子退路）＋ A-B 區段循環與段落跳轉；段落評分：沿用曲式分段與逐幀判定，二分搜尋歸段累計，含「音符不足 0.5 秒不評分」與「全距 < 5 個百分點不點名」兩道守門；曲庫分類：歌名/頻道名/歌詞三來源判語言（假名與諺文看比例、粵台語需 ≥2 種方言用字），結果快取進 metadata 只算一次；導唱自動 ducking：沿用評分心跳的逐幀判定，慢退（1.6s）快回（0.22s）＋ Schmitt 遲滯 0.55/0.35 ＋ 暖機 3 秒 ＋ 深度上限 0.95（永遠留安全網），時間常數式 EMA 使 30fps 與 120fps 行為一致；麥克風自動增益：前饋量測（analyser 在增益節點之前，不做回授免得與房間殘響耦合成呼吸迴路），噪音閘門 -45 dBFS 保證安靜時絕不加大，降 0.25s／升 3s 的不對稱曲線，削峰保護以 0.06s 追「輸入＋增益」的推估值且不當成降幅地板，遲滯（1 dB 起動 / 0.15 dB 收手）而非死區以免系統性差一格，加成上限 +9 dB、多人模式收到 +6 dB；ruff lint 與部署檔驗證納入 CI、後端 264 條 + 前端 75 條測試全綠；排程預處理：一次只處理一首（處理完就重新確認現場，讓路上限＝一首歌的時間），時段判斷含跨午夜與全天候，「為什麼還沒開始」常駐畫面，一首失敗不拖垮整批且可只重試失敗項，已完整快取的自動略過（看四個必要檔案而非只看 metadata），任務與「立即開始」意圖都持久化、重開機續跑；v1.0.0 可發布：Docker 一鍵部署（非 root、健康檢查、GPU 換底層映像）＋ 標籤觸發的 release 打包，版本號在 version.py / CHANGELOG / git 標籤三處交叉檢查；和聲：Krumhansl-Kessler 輪廓相關法估調性（權重看時間長度、單一長音上限 2 秒、有效音符 < 8 秒或相關 < 0.45 就拒絕作答並退成低八度），移調量照音階度數算（C 大調的 Do 上三度 +4、Re 上三度 +3），移調 DSP 自寫可變延遲移調（視窗 45ms、兩條讀取頭、交叉淡接只佔一輪 30% 把梳型抵消從 27% 壓到 8% 以內），沒人唱與無導唱音符時不出聲、同一音符不重算、換音符隔 80ms 防抖，音量上限 0.85 永不蓋過主唱；後端 268 條 + 前端 114 條測試全綠；對唱模式：串音判定不是把兩支麥克風混起來打一個分數，而是每一幀回答「這一幀算誰的」（電平差 ≥ 9 dB 只算大聲的那一位、Schmitt 遲滯 9/4.5 dB 免得門檻附近每幀換人、音高差 ≥ 1.5 半音就認定真的有兩個人在唱並照樣給分、但只在被壓的那一邊高於底噪 12 dB 時才敢用），判定一律在計分之前（先量兩支電平 → 判定 → tick(credit, reuseRms) 各自計分，不能先加分再回捲 Combo 與段落統計），比的是增益之前的原始電平（兩支各自的自動增益會抹平音量差），立體聲介面只給單聲道時明確拒絕而不悄悄退回（否則 B 麥拿到的是 A 的複製品、兩人分數一模一樣），各自被算到不足 10 秒就不比勝負、分數差 3% 以內算平手且前後端共用同一個門檻；段落對決：三道守門決定哪些段落可以比（兩邊各自被算到的導唱音符 ≥ 30 幀、少的一邊 ≥ 多的一邊的一半、命中率差 ≥ 5 個百分點才點主場），門檻沿用單人段落評分的同一組值並用測試釘在一起，分段接唱的段落標成「由 X 主唱」且沒唱的那一邊顯示「—」而非 0%，畫法是往中間對拉（兩張獨立長條圖要眼睛自己配對）、最多六段、主場段落入庫為 duel_section；後端 289 條 + 前端 149 條測試全綠；情境背景：靜態圖 MV 偵測每 1.2 秒把畫面縮成 32x18 取樣、平均亮度差門檻 2.0（實測會動的 MV 一筆取樣就得到 10.2、整首同一張圖六筆全是 0，兩邊都有五倍以上餘裕），判定需 4 筆取樣且橫跨 5 秒（觀察窗用牆上時鐘算，短片 loop 繞回 0 不會把它算成負的），暫停中不取樣（差值恆為 0 會誤判成靜止圖），兩個方向都閂鎖不再改判；亮度每秒最多變 0.45（等效閃爍遠低於光敏性癲癇的 3 Hz 安全線），鼓點只推粒子與波形不碰亮度；亮度被主題錨點、設定頁上限、字幕區 vignette 壓三道，情境背景出場時 vignette 自動放輕（三道各壓一點疊起來是全黑，是 render 出來才看到的）；背景為最低優先：30fps 上限、半解析度畫布、分頁看不見不畫、每幀成本超過 8ms 自動降級；自動主題以 FNV 雜湊挑，同一首歌永遠同一個背景；後端 293 條 + 前端 176 條測試全綠；跨場次段落趨勢：比的是一場演唱的形狀不是高度（每場先減自己的平均，且不照音符數加權 ——加權會讓最長的副歌主導基準線，等於拿副歌跟自己比），三道門才開口（同一曲式 ≥ 3 場、平均偏差 ≥ 5 個百分點沿用段落評分門檻、方向一致 ≥ 2/3 場次 ——第三道分得出「三次都掉一點」與「兩次正常一次崩掉」，平均值分不出），曲式指紋不同的場次不混算並以最新一場為準（否則重新處理後新資料永遠進不來），每位演唱者分開累積，只看最近 20 場，4 場以上才談進步退步；順手修掉舞台頁面從 v1.4.0 起的重傷 —— mic-agc.js 與 duet-scorer.js 都在最外層宣告 const SILENCE_DB，同一個全域作用域重複宣告讓 duet-scorer.js 解析階段就丟 SyntaxError 整支不執行，player.js 因此整支停在 new DuetScorer() 那一行（node --check 一次只看一支、node --test 給獨立作用域，兩道都測不到，是真的開瀏覽器才發現的），新增 script-scope.test.js 照 HTML 載入清單守全域名稱衝突；錄唱回放：錄音點在 mixBus（全部聲音先匯流再進 masterGain）而不是 masterGain 之後 —— 後者是喇叭音量，轉小或靜音會把那一次演唱錄成小聲或空白；MediaStreamDestination 只建一次重複用（每首歌建一個會在 AudioContext 裡累積永不回收的節點）；「唱了多久」累計的是毫秒（單幀差夾 100ms 防背景分頁）而不是 sangFrames —— 幀數在 30fps 與 120fps 的舞台上同一首歌差四倍；配額（預設 50 首 / 512 MB）從最舊、未標記保留的開始刪，舊的全被保留時當場拒絕並說明 —— 「先存再清」的寫法會拿剛存進來的那一筆當唯一可刪對象（單元測試先抓到）；webm 容器沒有 Duration（串流容器，錄時不知道會多長），清單長度改用錄的時候量好上傳的值，播放時 seek 到不可能的時間點逼瀏覽器算出長度再跳回 0（只做一次、只在要播時做）；上傳走 raw body + query string（不必多裝 python-multipart），讀 body 前先看 Content-Length；錄音 id 由伺服器產生並用嚴格正則檢查，路徑從索引檔名組出來再確認仍在錄音資料夾底下；以 Playwright 在真的瀏覽器裡跑過錄音→上傳→回放全程；後端 357 條 + 前端 213 條測試全綠"
