name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (syntax + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check (all Python sources)
        run: python -m compileall -q backend run.py rebuild_lyrics.py tests

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit & API tests
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend (JS syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check all frontend JS
        run: |
          set -e
          for f in frontend/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done
